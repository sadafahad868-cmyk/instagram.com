<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            display: grid;
            place-items: center;
            background: #d9d9d9;
            font-family: Arial, Helvetica, sans-serif;
        }

        .logo-stage {
            width: 80px;
            height: 80px;
            display: grid;
            place-items: center;
        }

        .instagram-badge {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #f10074 0%, #d10d8a 20%, #ff6a3d 58%, #ff9f1c 100%);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .instagram-badge svg {
            width: 76%;
            height: 76%;
            display: block;
        }
    </style>
</head>

<body>
    <div class="logo-stage">
        <div class="instagram-badge" aria-label="Instagram logo" role="img">
            <svg viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="100" y="100" width="500" height="500" rx="126" fill="none" stroke="white" stroke-width="30" />
                <circle cx="350" cy="350" r="180" fill="none" stroke="white" stroke-width="30" />
                <circle cx="350" cy="350" r="76" fill="none" stroke="white" stroke-width="22" />
                <circle cx="486" cy="228" r="22" fill="white" />
            </svg>
        </div>
    </div>
</body>

</html>
