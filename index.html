<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #e4e6eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .mobile-container {
            width: 100%;
            max-width: 390px;
            height: 100vh;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 16px;
            border-bottom: 1px solid #262626;
        }

        .back-button {
            background: none;
            border: none;
            color: #e4e6eb;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .back-button:active {
            opacity: 0.7;
        }

        .language-selector {
            background: none;
            border: none;
            color: #a0a0a0;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            transition: color 0.2s;
        }

        .language-selector:active {
            color: #e4e6eb;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 60px 20px 40px;
            overflow-y: auto;
        }

        .logo-container {
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .instagram-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #f10074 0%, #d10d8a 20%, #ff6a3d 58%, #ff9f1c 100%);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .instagram-logo svg {
            width: 76%;
            height: 76%;
            display: block;
        }

        .instagram-text {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #e4e6eb;
            margin-bottom: 60px;
            display: none;
        }

        .form-container {
            width: 100%;
        }

        .form-group {
            margin-bottom: 12px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            background-color: #262626;
            border: 1px solid #404040;
            border-radius: 8px;
            color: #e4e6eb;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        input[type="text"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder,
        textarea::placeholder {
            color: #a0a0a0;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            border-color: #5a5a5a;
            background-color: #1a1a1a;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input.error {
            border-color: #ed4956;
        }

        .error-message {
            color: #f15245;
            font-size: 12px;
            margin-top: 6px;
            display: none;
            padding: 0 2px;
        }

        .error-message.show {
            display: block;
        }

        .login-button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #0a66c2;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: inherit;
        }

        .login-button:active {
            background-color: #0857a0;
        }

        .login-button:disabled {
            background-color: #0857a0;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }

        .forgot-password a {
            color: #e4e6eb;
            text-decoration: none;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        .forgot-password a:active {
            opacity: 0.7;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 32px 0 24px;
            font-size: 13px;
            color: #a0a0a0;
            gap: 16px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #262626;
        }

        .signup-section {
            width: 100%;
            margin-top: 32px;
        }

        .create-account-button {
            width: 100%;
            padding: 10px;
            background: none;
            border: 1.5px solid #0a66c2;
            border-radius: 8px;
            color: #0a66c2;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .create-account-button:active {
            background-color: rgba(10, 102, 194, 0.1);
        }

        .footer {
            padding: 20px;
            text-align: center;
            border-top: 1px solid #262626;
        }

        .meta-logo {
            font-size: 14px;
            color: #a0a0a0;
            letter-spacing: 1px;
        }

        .success-message {
            background-color: #2d5016;
            color: #31a24c;
            border: 1px solid #3d6b21;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
            text-align: center;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 480px) {
            .mobile-container {
                max-width: 100%;
            }

            .content {
                padding: 50px 20px 40px;
            }

            .logo-container {
                margin-bottom: 60px;
            }
        }
    </style>
</head>

<body>
    <div class="mobile-container">
        <div class="header">
            <button class="back-button" onclick="history.back()">←</button>
            <button class="language-selector">
                English (UK) ▼
            </button>
        </div>

        <div class="content">
            <div class="logo-container">
                <div class="instagram-logo" aria-label="Instagram logo">
                    <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <rect x="38" y="40" width="164" height="160" rx="38" fill="none" stroke="white"
                            stroke-width="12" />
                        <circle cx="120" cy="120" r="48" fill="none" stroke="white" stroke-width="12" />
                        <circle cx="120" cy="120" r="20" fill="none" stroke="white" stroke-width="10" />
                        <circle cx="170" cy="79" r="10" fill="white" />
                    </svg>
                </div>
                <div class="instagram-text">instagram</div>
            </div>

            <div class="form-container">
                <div class="success-message" id="successMessage">
                    Message sent successfully! ✓
                </div>

                <form id="contactForm">
                    <div class="form-group">
                        <input type="text" id="name" placeholder="Your name" autocomplete="name">
                        <div class="error-message" id="nameError"></div>
                    </div>

                    <div class="form-group">
                        <input type="email" id="email" placeholder="Email address" autocomplete="email">
                        <div class="error-message" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <input type="text" id="subject" placeholder="Subject" autocomplete="off">
                        <div class="error-message" id="subjectError"></div>
                    </div>

                    <div class="form-group">
                        <textarea id="message" placeholder="Your message"></textarea>
                        <div class="error-message" id="messageError"></div>
                    </div>

                    <button type="submit" class="login-button" id="submitBtn">Send message</button>
                </form>

                <div class="signup-section">
                    <button class="create-account-button"
                        onclick="window.location.href = 'mailto:mallickfahad13@gmail.com'">
                        Email us directly
                    </button>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="meta-logo">∞ Meta</div>
        </div>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const subjectInput = document.getElementById('subject');
        const messageInput = document.getElementById('message');
        const nameError = document.getElementById('nameError');
        const emailError = document.getElementById('emailError');
        const subjectError = document.getElementById('subjectError');
        const messageError = document.getElementById('messageError');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');

        function clearErrors() {
            [nameError, emailError, subjectError, messageError].forEach((error) => error.classList.remove('show'));
            [nameInput, emailInput, subjectInput, messageInput].forEach((input) => input.classList.remove('error'));
        }

        function setError(input, errorElement, text) {
            input.classList.add('error');
            errorElement.textContent = text;
            errorElement.classList.add('show');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors();

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const subject = subjectInput.value.trim();
            const message = messageInput.value.trim();
            let hasError = false;

            if (!name) {
                setError(nameInput, nameError, 'Name is required.');
                hasError = true;
            }

            if (!email) {
                setError(emailInput, emailError, 'Email is required.');
                hasError = true;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                setError(emailInput, emailError, 'Enter a valid email address.');
                hasError = true;
            }

            if (!subject) {
                setError(subjectInput, subjectError, 'Subject is required.');
                hasError = true;
            }

            if (!message) {
                setError(messageInput, messageError, 'Message is required.');
                hasError = true;
            }

            if (hasError) {
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                const response = await fetch('http://localhost:3000/api/contact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, subject, message })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Unable to send message.');
                }

                successMessage.classList.add('show');
                form.reset();
            } catch (error) {
                successMessage.textContent = error.message || 'Something went wrong. Please try again.';
                successMessage.classList.add('show');
                successMessage.style.backgroundColor = '#5a1d1d';
                successMessage.style.color = '#ffb4b4';
                successMessage.style.borderColor = '#8a2e2e';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send message';
            }
        });

        [nameInput, emailInput, subjectInput, messageInput].forEach((input) => {
            input.addEventListener('focus', () => {
                if (input.classList.contains('error')) {
                    input.classList.remove('error');
                    const errorId = input.id + 'Error';
                    const errorElement = document.getElementById(errorId);
                    errorElement.classList.remove('show');
                }

                successMessage.classList.remove('show');
                successMessage.style.backgroundColor = '#2d5016';
                successMessage.style.color = '#31a24c';
                successMessage.style.borderColor = '#3d6b21';
                successMessage.textContent = 'Message sent successfully! ✓';
            });
        });

        document.querySelector('.language-selector').addEventListener('click', () => {
            alert('Language selection: English (UK), Español, Português, etc.');
        });
    </script>
</body>

</html>
